version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # oxlint.config.ts loads these presets; @eslint/js 10 needs eslint 10, which
      # eslint-plugin-react and eslint-plugin-jsx-a11y do not support yet.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # "typescript" is an alias of TypeScript 6 for typescript-eslint (requires < 6.1);
      # the compiler itself is TypeScript 7 via @typescript/native.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
